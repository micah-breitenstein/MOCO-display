<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MOCO Jib - Drone Mode</title>
<style>
body{margin:0;padding:0;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100vh}
.header{background:#1a1a1a;border-bottom:2px solid #ff9000;padding:15px 20px;display:flex;align-items:center;justify-content:space-between}
h1{color:#ff9000;margin:0;font-size:1.5em}
.nav{display:flex;gap:15px}
.nav a{color:#aaa;text-decoration:none;padding:5px 10px;border-radius:4px;transition:all .3s}
.nav a:hover{color:#fff;background:#333}
.nav a.active{color:#ff9000;background:#222}
.content{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:30px}
.status{padding:15px;background:#222;border-left:4px solid #666;border-radius:4px;width:100%;max-width:600px;text-align:center}
.status.active{border-color:#00e676;background:#1a3a1a}
.status.active .status-text{color:#00e676}
.status-text{color:#aaa;font-size:0.95em}
.waypoint-info{padding:15px;background:#1a1a1a;border:2px solid #ff9000;border-radius:8px;width:100%;max-width:600px;text-align:center;display:none}
.waypoint-info.visible{display:block}
.waypoint-count{font-size:2.5em;color:#ff9000;font-weight:bold;margin:10px 0}
.waypoint-label{color:#aaa;font-size:0.9em;text-transform:uppercase}
.progress-info{padding:10px;background:#222;border-radius:6px;margin-top:10px}
.progress-text{color:#00e676;font-size:1.1em;font-weight:bold}
.eta-text{color:#aaa;font-size:0.9em;margin-top:5px}
.progress-bar-container{width:100%;height:20px;background:#333;border-radius:10px;margin:10px 0;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#ff9000,#00e676);transition:width 0.3s ease;border-radius:10px}
.control-indicator{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,144,0,0.95);color:#000;padding:30px 50px;border-radius:15px;font-size:2em;font-weight:bold;text-align:center;display:none;z-index:3000;box-shadow:0 0 30px rgba(255,144,0,0.6)}
.control-indicator.visible{display:block;animation:fadeInOut 0.8s ease}
@keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}}
.joysticks{display:flex;gap:40px;justify-content:center;align-items:center;margin-top:20px;flex-wrap:wrap}
.joystick-container{display:flex;flex-direction:column;align-items:center;gap:15px}
.joystick-label{color:#ff9000;font-size:1.1em;font-weight:bold}
.joystick{position:relative;width:200px;height:200px;background:#1a1a1a;border:3px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center}
.joystick-ring{position:absolute;width:180px;height:180px;border:2px solid #444;border-radius:50%}
.joystick-center{position:absolute;width:10px;height:10px;background:#555;border-radius:50%}
.joystick-stick{position:absolute;width:40px;height:40px;background:#ff9000;border:3px solid #fff;border-radius:50%;transition:all .05s;cursor:pointer;box-shadow:0 0 15px rgba(255,144,0,0.5)}
.joystick-stick.pressed{background:#00e676;box-shadow:0 0 20px rgba(0,230,118,0.8)}
.joystick-crosshair{position:absolute;width:100%;height:100%;pointer-events:none}
.crosshair-h{position:absolute;top:50%;left:10px;right:10px;height:1px;background:#333;transform:translateY(-50%)}
.crosshair-v{position:absolute;left:50%;top:10px;bottom:10px;width:1px;background:#333;transform:translateX(-50%)}
.axis-labels{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:10px}
.axis-label{color:#aaa;font-size:0.85em;font-family:monospace}
.axis-label.active{color:#ff9000;font-weight:bold}
.modifiers{display:flex;gap:20px;padding:20px;background:#1a1a1a;border-radius:8px;border:1px solid #333;flex-wrap:wrap;justify-content:center}
.modifier{display:flex;flex-direction:column;align-items:center;gap:8px;padding:15px;background:#222;border-radius:6px;min-width:100px}
.modifier-icon{width:40px;height:40px;background:#333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5em;transition:all .3s}
.modifier.active .modifier-icon{background:#00e676;color:#000}
.modifier-label{color:#aaa;font-size:0.9em}
.modifier.active .modifier-label{color:#00e676;font-weight:bold}
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:2000}
.loading-overlay.hidden{display:none}
.spinner{width:60px;height:60px;border:4px solid #333;border-top:4px solid #ff9000;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
<div class="spinner"></div>
</div>
<div class="control-indicator" id="controlIndicator"></div>
<div class="header">
<h1>MOCO JIB</h1>
<div class="nav">
<a href="/console">Console</a>
<a href="/settings">Settings</a>
<a href="/timelapse">Timelapse</a>
<a href="/bounce">Bounce</a>
<a href="/dronemode" class="active">Drone Mode</a>
</div>
</div>
<div class="content">
<div class="status" id="status">
<div class="status-text" id="statusText">Connecting...</div>
</div>
<div class="waypoint-info" id="waypointInfo">
<div class="waypoint-label" id="waypointLabel">Waypoints</div>
<div class="waypoint-count" id="waypointCount">0/0</div>
<div class="progress-bar-container" id="progressBarContainer" style="display:none">
<div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div>
</div>
<div class="progress-info" id="progressInfo" style="display:none">
<div class="progress-text" id="progressText">0%</div>
<div class="eta-text" id="etaText">ETA: --s</div>
</div>
</div>
<div class="joysticks">
<div class="joystick-container">
<div class="joystick-label">LEFT STICK</div>
<div class="joystick">
<div class="joystick-crosshair">
<div class="crosshair-h"></div>
<div class="crosshair-v"></div>
</div>
<div class="joystick-ring"></div>
<div class="joystick-center"></div>
<div class="joystick-stick" id="leftStick"></div>
</div>
<div class="axis-labels">
<div class="axis-label" id="leftX">SWING: 0%</div>
<div class="axis-label" id="leftY">LIFT: 0%</div>
</div>
</div>
<div class="joystick-container">
<div class="joystick-label">RIGHT STICK</div>
<div class="joystick">
<div class="joystick-crosshair">
<div class="crosshair-h"></div>
<div class="crosshair-v"></div>
</div>
<div class="joystick-ring"></div>
<div class="joystick-center"></div>
<div class="joystick-stick" id="rightStick"></div>
</div>
<div class="axis-labels">
<div class="axis-label" id="rightX">PAN: 0%</div>
<div class="axis-label" id="rightY">TILT: 0%</div>
</div>
</div>
</div>
<div class="modifiers">
<div class="modifier" id="precisionMod">
<div class="modifier-icon">◇</div>
<div class="modifier-label">PRECISION</div>
</div>
<div class="modifier" id="boostMod">
<div class="modifier-icon">⚡</div>
<div class="modifier-label">BOOST</div>
</div>
<div class="modifier" id="cameraMod">
<div class="modifier-icon">📷</div>
<div class="modifier-label">CAMERA</div>
</div>
</div>
</div>
<script>
var ws;
var leftStick=document.getElementById('leftStick');
var rightStick=document.getElementById('rightStick');
var leftX=document.getElementById('leftX');
var leftY=document.getElementById('leftY');
var rightX=document.getElementById('rightX');
var rightY=document.getElementById('rightY');
var statusDiv=document.getElementById('status');
var statusTextDiv=document.getElementById('statusText');
var precisionMod=document.getElementById('precisionMod');
var boostMod=document.getElementById('boostMod');
var cameraMod=document.getElementById('cameraMod');
var waypointInfo=document.getElementById('waypointInfo');
var waypointCount=document.getElementById('waypointCount');
var waypointLabel=document.getElementById('waypointLabel');
var progressInfo=document.getElementById('progressInfo');
var progressText=document.getElementById('progressText');
var etaText=document.getElementById('etaText');
var progressBarContainer=document.getElementById('progressBarContainer');
var progressBarFill=document.getElementById('progressBarFill');
var controlIndicator=document.getElementById('controlIndicator');
console.log('[DRONEMODE] Elements initialized:',{statusDiv:statusDiv,statusTextDiv:statusTextDiv,leftStick:leftStick});
var droneActive=false,reconnecting=false,statusReceived=false;
var captureStartTime=null;
var controlIndicatorTimeout=null;

function showControlIndicator(text){
clearTimeout(controlIndicatorTimeout);
controlIndicator.textContent=text;
controlIndicator.classList.add('visible');
controlIndicatorTimeout=setTimeout(function(){
controlIndicator.classList.remove('visible');
},800);
}

function formatElapsedTime(seconds){
if(seconds<60)return seconds+'s';
var mins=Math.floor(seconds/60);
var secs=seconds%60;
return mins+'m '+secs+'s';
}

function hideLoading(){document.getElementById('loadingOverlay').classList.add('hidden')}

function updateJoystick(stick,xPercent,yPercent,pressed){
var maxOffset=80;
var x=Math.max(-100,Math.min(100,xPercent));
var y=Math.max(-100,Math.min(100,yPercent));
var offsetX=(x/100)*maxOffset;
var offsetY=-(y/100)*maxOffset;
stick.style.transform='translate('+offsetX+'px,'+offsetY+'px)';
if(pressed){stick.classList.add('pressed')}else{stick.classList.remove('pressed')}
}

function updateAxisLabel(label,name,value){
label.textContent=name+': '+value+'%';
if(value!==0){label.classList.add('active')}else{label.classList.remove('active')}
}

function connect(){
if(reconnecting)return;
reconnecting=true;
if(ws){try{ws.close()}catch(e){}}
ws=new WebSocket('ws://192.168.4.1/ws');
ws.onopen=function(){
console.log('[DRONEMODE] WebSocket connected');
ws.send('PAGE:DRONEMODE');
reconnecting=false;
statusDiv.classList.add('active');
statusTextDiv.textContent='Connected';
console.log('[DRONEMODE] Status set to Connected');
setTimeout(function(){if(!statusReceived)hideLoading()},500);
};
ws.onmessage=function(e){
console.log('[WS RX]',e.data);
if(e.data.startsWith('DRONE_STICK:')){
var payload=e.data.substring(12);
var parts=payload.split(',');
if(parts.length>=6){
var swing=parseInt(parts[0])||0;
var lift=parseInt(parts[1])||0;
var pan=parseInt(parts[2])||0;
var tilt=parseInt(parts[3])||0;
var leftClick=parseInt(parts[4])||0;
var rightClick=parseInt(parts[5])||0;
updateJoystick(leftStick,swing,lift,leftClick!==0);
updateJoystick(rightStick,pan,tilt,rightClick!==0);
updateAxisLabel(leftX,'SWING',swing);
updateAxisLabel(leftY,'LIFT',lift);
updateAxisLabel(rightX,'PAN',pan);
updateAxisLabel(rightY,'TILT',tilt);
if(!droneActive){
droneActive=true;
statusDiv.classList.add('active');
statusTextDiv.textContent='Drone mode active';
console.log('[DRONEMODE] Status set to Drone mode active (DRONE_STICK)');
}
}
}else if(e.data.startsWith('MODE:DRONE')){
droneActive=true;
statusDiv.classList.add('active');
statusTextDiv.textContent='Drone mode active';
statusReceived=true;
hideLoading();
}else if(e.data.startsWith('MODE:')&&!e.data.startsWith('MODE:DRONE')){
droneActive=false;
statusDiv.classList.remove('active');
statusTextDiv.textContent='Drone mode inactive';
statusReceived=true;
hideLoading();
}else if(e.data.indexOf('DRONE MODE ACTIVATED')>=0){
droneActive=true;
statusDiv.classList.add('active');
statusTextDiv.textContent='Drone mode active';
}else if(e.data.indexOf('DRONE MODE DEACTIVATED')>=0){
droneActive=false;
statusDiv.classList.remove('active');
statusTextDiv.textContent='Drone mode inactive';
updateJoystick(leftStick,0,0,false);
updateJoystick(rightStick,0,0,false);
updateAxisLabel(leftX,'SWING',0);
updateAxisLabel(leftY,'LIFT',0);
updateAxisLabel(rightX,'PAN',0);
updateAxisLabel(rightY,'TILT',0);
}else if(e.data.startsWith('DRONE_MODIFIER:')){
var payload=e.data.substring(15);
var parts=payload.split(',');
if(parts.length>=2){
var precisionStr=parts[0].split('=')[1];
var boostStr=parts[1].split('=')[1];
var precision=parseInt(precisionStr)||0;
var boost=parseInt(boostStr)||0;
if(precision!==0){precisionMod.classList.add('active')}else{precisionMod.classList.remove('active')}
if(boost!==0){boostMod.classList.add('active')}else{boostMod.classList.remove('active')}
if(!droneActive){
droneActive=true;
statusDiv.classList.add('active');
statusTextDiv.textContent='Drone mode active';
}
}
}else if(e.data.indexOf('TRIGGER:MANUAL_DRONE')>=0){
console.log('[DRONEMODE] Camera trigger received');
cameraMod.classList.add('active');
setTimeout(function(){cameraMod.classList.remove('active')},420);
}else if(e.data.indexOf('WAYPOINT_COUNT:')>=0){
var match=e.data.match(/WAYPOINT_COUNT:(\d+)\/(\d+)/);
if(match){
var current=parseInt(match[1]);
var total=parseInt(match[2]);
waypointCount.textContent=current+'/'+total;
waypointLabel.textContent='Waypoints Recorded';
waypointInfo.classList.add('visible');
progressInfo.style.display='none';
}
}else if(e.data.indexOf('PREVIEW_WAYPOINT:')>=0){
var match=e.data.match(/PREVIEW_WAYPOINT:(\d+)\/(\d+)/);
if(match){
var current=parseInt(match[1]);
var total=parseInt(match[2]);
waypointCount.textContent=current+'/'+total;
waypointLabel.textContent='Preview Waypoint';
waypointInfo.classList.add('visible');
progressInfo.style.display='none';
}
}else if(e.data.indexOf('waypoint recorded')>=0){
var match=e.data.match(/waypoint recorded (\d+)\/(\d+)/);
if(match){
var current=parseInt(match[1]);
var total=parseInt(match[2]);
waypointCount.textContent=current+'/'+total;
waypointLabel.textContent='Waypoint Recorded';
waypointInfo.classList.add('visible');
progressInfo.style.display='none';
}
}else if(e.data.indexOf('Flowlapse:')>=0&&e.data.indexOf('%')>=0&&e.data.indexOf('ETA')>=0){
var flowlapseMatch=e.data.match(/Flowlapse:\s*(\d+)%\s*ETA\s*(\d+)s/);
if(flowlapseMatch){
var percent=parseInt(flowlapseMatch[1]);
var eta=parseInt(flowlapseMatch[2]);
progressText.textContent=percent+'%';
etaText.textContent='ETA: '+eta+'s';
progressBarFill.style.width=percent+'%';
progressInfo.style.display='block';
progressBarContainer.style.display='block';
waypointLabel.textContent='Flowlapse Active';
waypointInfo.classList.add('visible');
}
}else if(e.data.indexOf('progress=')>=0&&e.data.indexOf('eta=')>=0){
var progressMatch=e.data.match(/progress=(\d+)%/);
var etaMatch=e.data.match(/eta=(\d+)s/);
var waypointMatch=e.data.match(/waypoint (\d+)\/(\d+)/);
if(progressMatch&&etaMatch){
var percent=parseInt(progressMatch[1]);
var eta=parseInt(etaMatch[1]);
progressText.textContent=percent+'%';
etaText.textContent='ETA: '+eta+'s';
progressBarFill.style.width=percent+'%';
progressInfo.style.display='block';
progressBarContainer.style.display='block';
if(waypointMatch){
var current=parseInt(waypointMatch[1]);
var total=parseInt(waypointMatch[2]);
waypointCount.textContent=current+'/'+total;
waypointLabel.textContent='Flowlapse Active';
waypointInfo.classList.add('visible');
}
}
}else if(e.data.indexOf('returning to waypoint 1')>=0){
waypointLabel.textContent='Returning to Origin';
waypointInfo.classList.add('visible');
progressInfo.style.display='none';
}else if(e.data.indexOf('return to waypoint 1 complete')>=0){
waypointLabel.textContent='At Waypoint 1';
waypointInfo.classList.add('visible');
progressInfo.style.display='none';
}else if(e.data.indexOf('preview started')>=0){
waypointLabel.textContent='Preview Running';
waypointInfo.classList.add('visible');
progressInfo.style.display='none';
}else if(e.data.indexOf('preview complete')>=0){
waypointLabel.textContent='Preview Complete';
waypointInfo.classList.add('visible');
progressInfo.style.display='none';
}else if(e.data.indexOf('capture run started')>=0){
captureStartTime=Math.floor(Date.now()/1000);
waypointLabel.textContent='Capture Started';
waypointInfo.classList.add('visible');
progressInfo.style.display='none';
progressBarContainer.style.display='none';
}else if(e.data.indexOf('capture complete')>=0){
var elapsed='';
if(captureStartTime!==null){
var elapsedSeconds=Math.floor(Date.now()/1000)-captureStartTime;
elapsed=' ('+formatElapsedTime(elapsedSeconds)+')';
captureStartTime=null;
}
waypointLabel.textContent='Capture Complete'+elapsed;
waypointInfo.classList.add('visible');
progressInfo.style.display='none';
progressBarContainer.style.display='none';
}else if(e.data.indexOf('recording stopped')>=0){
var recMatch=e.data.match(/(\d+)\/(\d+)/);
if(recMatch){
var total=parseInt(recMatch[2]);
waypointCount.textContent=total+'/'+total;
waypointLabel.textContent='Recording Complete';
waypointInfo.classList.add('visible');
}
progressInfo.style.display='none';
progressBarContainer.style.display='none';
}else if(e.data.indexOf('recording re-armed')>=0||e.data.indexOf('Recording re-armed')>=0){
waypointCount.textContent='0/0';
waypointLabel.textContent='Waypoints';
waypointInfo.classList.remove('visible');
progressInfo.style.display='none';
progressBarContainer.style.display='none';
}else if(e.data.startsWith('CONTROL:')){
var control=e.data.substring(8);
if(control==='FOCUS_LEFT'){
showControlIndicator('FOCUS LEFT');
}else if(control==='FOCUS_RIGHT'){
showControlIndicator('FOCUS RIGHT');
}else if(control==='FOCUS_SPEED_DOWN'){
showControlIndicator('FOCUS SPEED\nDOWN');
}else if(control==='FOCUS_SPEED_UP'){
showControlIndicator('FOCUS SPEED\nUP');
}
}
};
ws.onclose=function(){
statusTextDiv.textContent='Reconnecting...';
statusDiv.classList.remove('active');
droneActive=false;
setTimeout(function(){reconnecting=false;connect()},2000);
};
ws.onerror=function(){
statusTextDiv.textContent='Connection error';
statusDiv.classList.remove('active');
droneActive=false;
};
}
console.log('[DRONEMODE] Attaching camera click handler, cameraMod=',cameraMod);
cameraMod.addEventListener('click',function(){
console.log('[DRONEMODE] Camera button clicked!');
if(ws&&ws.readyState===WebSocket.OPEN){
console.log('[DRONEMODE] Sending camera trigger command');
ws.send('SET:TRIGGER:DRONE');
cameraMod.classList.add('active');
setTimeout(function(){cameraMod.classList.remove('active')},420);
}else{
console.log('[DRONEMODE] Cannot send camera trigger - WebSocket not ready');
}
});
connect();
</script>
</body>
</html>
