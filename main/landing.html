<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOCO Jib</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e0e0e0;font-family:'Courier New',monospace;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:#111;border-bottom:2px solid #e87700;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{font-size:1.1em;font-weight:700;color:#ff9000;letter-spacing:4px}
.conn{display:flex;align-items:center;gap:6px;font-size:0.75em;color:#888}
.dot{width:9px;height:9px;border-radius:50%;background:#333;transition:background .4s}
.dot.live{background:#00e676;box-shadow:0 0 8px #00e676}
nav{background:#111;border-bottom:1px solid #222;flex-shrink:0;display:flex}
.tab{flex:1;padding:9px 4px;text-align:center;font-size:0.72em;letter-spacing:2px;color:#555;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:#ff9000;border-bottom-color:#ff9000}
.pane{flex:1;overflow:hidden;display:none;flex-direction:column}
.pane.on{display:flex}
#log{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:1px}
.ev{display:flex;gap:10px;font-size:0.8em;padding:3px 0;border-bottom:1px solid #181818}
.ts{color:#444;white-space:nowrap;flex-shrink:0}
.msg{word-break:break-word}
.sys{color:#ffa040}
#sp{flex:1;overflow-y:auto;padding:8px 14px}
.grp{font-size:0.65em;letter-spacing:3px;color:#e87700;padding:12px 0 4px;border-bottom:1px solid #e87700;margin-bottom:2px}
.sr{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1a1a1a;font-size:0.82em}
.sl{color:#888}
.sc{display:flex;align-items:center;gap:7px}
.sv{width:52px;text-align:center;color:#e0e0e0;font:inherit;background:#181818;border:1px solid #333;border-radius:4px;padding:4px 0}
.adj{background:#1a1a1a;border:1px solid #333;border-radius:4px;color:#ccc;width:28px;height:28px;font-size:1.1em;cursor:pointer}
.tog{background:#1a1a1a;border:1px solid #333;border-radius:4px;color:#888;padding:4px 12px;font:inherit;font-size:0.78em;cursor:pointer}
.tog.on{background:#0d2a0d;border-color:#00e676;color:#00e676}
.abtn{background:#1a1a1a;border:1px solid #444;border-radius:4px;color:#ccc;padding:4px 14px;font:inherit;font-size:0.78em;cursor:pointer}
.abtn.red{border-color:#7a2020;color:#e05050}
.sbtn{display:block;width:100%;margin-top:16px;padding:12px;background:#1a0d00;border:1px solid #e87700;border-radius:6px;color:#ff9000;font:inherit;font-size:0.82em;letter-spacing:2px;cursor:pointer}
#tl{flex:1;overflow-y:auto;padding:8px 14px}.mc{background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:10px 8px;margin-bottom:7px;cursor:pointer;font-size:0.78em;text-align:center;color:#ccc;letter-spacing:1px}.mc.act{border-color:#e87700;color:#ff9000;background:#1a0d00}.stop{display:block;width:100%;padding:11px;background:#200000;border:1px solid #7a2020;border-radius:6px;color:#e05050;font:inherit;font-size:0.82em;letter-spacing:2px;cursor:pointer;margin-top:6px}.stop:disabled{opacity:.3;cursor:default}
</style></head><body>
<header><span class="brand">MOCO JIB</span><div class="conn"><div class="dot" id="dot"></div><span id="cst">Connecting…</span></div></header>
<nav>
  <div class="tab on" id="tc" onclick="ST('c')">CONSOLE</div>
  <div class="tab" id="ts" onclick="ST('s')">SETTINGS</div>
  <div class="tab" id="tt" onclick="ST('t')">TIMELAPSE</div>
</nav>
<div class="pane on" id="pc"><div id="log"></div></div>
<div class="pane" id="ps"><div id="sp">
  <div class="grp">BRIGHTNESS</div>
  <div class="sr"><span class="sl">Display Brt (%)</span><div class="sc"><button class="adj" onclick="adjDisp(-5)">-</button><input class="sv" id="dbrt" type="number" value="100" min="0" max="100" step="5"><button class="adj" onclick="adjDisp(5)">+</button></div></div>
  <div class="sr"><span class="sl">Matrix Brt (%)</span><div class="sc"><button class="adj" onclick="adj('mtxb',-5)">-</button><input class="sv" id="mtxb" type="number" value="5" min="0" max="100" step="5"><button class="adj" onclick="adj('mtxb',5)">+</button></div></div>
  <div class="sr"><span class="sl">Night Mode</span><div class="sc"><button class="tog" id="tnm" onclick="togNight()">OFF</button></div></div>
  <div class="grp">SYSTEM</div>
  <div class="sr"><span class="sl">Rumble Mute</span><div class="sc"><button class="tog" id="trm" onclick="togRumble()">OFF</button></div></div>
  <div class="grp">TIMELAPSE</div>
  <div class="sr"><span class="sl">Interval (s)</span><div class="sc"><button class="adj" onclick="adj('tli',-1)">-</button><input class="sv" id="tli" type="number" value="15" min="1" max="120"><button class="adj" onclick="adj('tli',1)">+</button></div></div>
  <div class="sr"><span class="sl">Step Dist (ms)</span><div class="sc"><button class="adj" onclick="adj('tls',-10)">-</button><input class="sv" id="tls" type="number" value="250" min="50" max="2000" step="10"><button class="adj" onclick="adj('tls',10)">+</button></div></div>
  <div class="grp">DRONE MODE</div>
  <div class="sr"><span class="sl">Accel (ms)</span><div class="sc"><button class="adj" onclick="adj('dac',-100)">-</button><input class="sv" id="dac" type="number" value="1100" min="200" max="3000" step="100"><button class="adj" onclick="adj('dac',100)">+</button></div></div>
  <div class="sr"><span class="sl">Active Decel (ms)</span><div class="sc"><button class="adj" onclick="adj('dad',-100)">-</button><input class="sv" id="dad" type="number" value="1300" min="200" max="3000" step="100"><button class="adj" onclick="adj('dad',100)">+</button></div></div>
  <div class="sr"><span class="sl">Release Decel (ms)</span><div class="sc"><button class="adj" onclick="adj('drd',-100)">-</button><input class="sv" id="drd" type="number" value="1100" min="200" max="3000" step="100"><button class="adj" onclick="adj('drd',100)">+</button></div></div>
  <div class="sr"><span class="sl">Rev Cooldown (ms)</span><div class="sc"><button class="adj" onclick="adj('dcd',-100)">-</button><input class="sv" id="dcd" type="number" value="1400" min="200" max="5000" step="100"><button class="adj" onclick="adj('dcd',100)">+</button></div></div>
  <div class="grp">ZEROING</div>
  <div class="sr"><span class="sl">Set Zero</span><div class="sc"><button class="abtn" onclick="send('SET:HOME_SET:1')">SET</button></div></div>
  <div class="sr"><span class="sl">Go to Zero</span><div class="sc"><button class="abtn" onclick="send('SET:HOME_GO:1')">GO</button></div></div>
  <div class="sr"><span class="sl">Clear Zero</span><div class="sc"><button class="abtn red" onclick="send('SET:HOME_CLEAR:1')">CLEAR</button></div></div>
  <button class="sbtn" onclick="save()">SAVE SETTINGS</button>
</div></div>
<div class="pane" id="pt"><div id="tl"></div></div>
<script>
var log=document.getElementById('log'),dot=document.getElementById('dot'),cst=document.getElementById('cst'),ws,rt,rm=false,nm=false;
function ts(){var d=new Date(),p=function(n){return n<10?'0'+n:n};return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
function row(msg,cls){var e=document.createElement('div');e.className='ev';e.innerHTML='<span class="ts">'+ts()+'</span><span class="msg '+(cls||'')+'">'+msg.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>';log.appendChild(e);if(log.children.length>500)log.removeChild(log.firstChild);log.scrollTop=log.scrollHeight}
function send(m){if(ws&&ws.readyState===1)ws.send(m)}
window.ST=function(t){['c','s','t'].forEach(function(k){document.getElementById('t'+k).className='tab'+(k===t?' on':'');document.getElementById('p'+k).className='pane'+(k===t?' on':'')})};
window.adj=function(id,d){var el=document.getElementById(id);el.value=Math.max(+el.min,Math.min(+el.max,+el.value+d))}
window.adjDisp=function(d){var el=document.getElementById('dbrt');el.value=Math.max(0,Math.min(100,+el.value+d));send('SET:DISP_BRT:'+el.value)}
function setUI(id,v){var b=document.getElementById(id);b.textContent=v?'ON':'OFF';b.className='tog'+(v?' on':'')}
window.togNight=function(){nm=!nm;setUI('tnm',nm);send('SET:NIGHT:'+(nm?'1':'0'))}
window.togRumble=function(){rm=!rm;setUI('trm',rm);send('SET:RUMBLE_MUTE:'+(rm?'1':'0'))}
window.save=function(){send('SET:MTX_BRT:'+document.getElementById('mtxb').value);send('SET:TL_INT:'+document.getElementById('tli').value);send('SET:TL_STEP:'+document.getElementById('tls').value);send('SET:DRONE_ACCEL:'+document.getElementById('dac').value);send('SET:DRONE_ACTDECEL:'+document.getElementById('dad').value);send('SET:DRONE_RELDECEL:'+document.getElementById('drd').value);send('SET:DRONE_COOLDOWN:'+document.getElementById('dcd').value);send('SETTINGS_SAVED')}
var tla=false,MN=['SWING L/BOOM D','SWING L/BOOM U','SWING R/BOOM U','SWING R/BOOM D','SWING L ONLY','BOOM UP ONLY','SWING R ONLY','BOOM DN ONLY'];
(function(){var h='';for(var i=0;i<8;i++)h+='<div class="mc" id="m'+(i+1)+'" onclick="tlS('+(i+1)+')">'+(MN[i])+'</div>';h+='<button class="stop" id="sb" disabled onclick="tlX()">STOP TIMELAPSE</button>';document.getElementById('tl').innerHTML=h})();
function tlReset(){tla=false;for(var i=1;i<=8;i++)document.getElementById('m'+i).className='mc';document.getElementById('sb').disabled=true}
window.tlS=function(n){if(tla)return;tla=true;for(var i=1;i<=8;i++)document.getElementById('m'+i).className='mc'+(i===n?' act':'');document.getElementById('sb').disabled=false;send('CMD:TL_START:'+n)};
window.tlX=function(){tlReset();send('CMD:TL_STOP')};
function parse(m){var o;if((o=m.match(/^TIMELAPSE_INTERVAL:(\d+)$/)))document.getElementById('tli').value=o[1];if((o=m.match(/^TIMELAPSE_STEPDIST:(\d+)$/)))document.getElementById('tls').value=o[1];if(m==='RUMBLE_MUTE:ON')setUI('trm',rm=true);if(m==='RUMBLE_MUTE:OFF')setUI('trm',rm=false);if(m==='Night Mode: ON'){setUI('tnm',nm=true);document.getElementById('mtxb').value=0;document.getElementById('dbrt').value=10}if(m==='Night Mode: OFF'){setUI('tnm',nm=false);document.getElementById('mtxb').value=5;document.getElementById('dbrt').value=100}if(m==='WEB_CMD:TL_STOPPED'||m==='WEB_CMD:TL_BLOCKED')tlReset();if(m==='WEB_CMD:TL_STARTED'){tla=true;document.getElementById('sb').disabled=false}}
function connect(){clearTimeout(rt);ws=new WebSocket('ws://192.168.4.1/ws');ws.onopen=function(){dot.className='dot live';cst.textContent='Live';row('Console connected','sys')};ws.onmessage=function(e){row(e.data);parse(e.data)};ws.onclose=function(){dot.className='dot';cst.textContent='Reconnecting…';rt=setTimeout(connect,1000)};ws.onerror=function(){ws.close()}}
rt=setTimeout(connect,1500);
</script></body></html>
