<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOCO Jib</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e0e0e0;font-family:'Courier New',monospace;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:#111;border-bottom:2px solid #e87700;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{font-size:1.15em;font-weight:700;color:#ff9000;letter-spacing:4px}
.conn{display:flex;align-items:center;gap:8px;font-size:0.75em;color:#888}
.dot{width:9px;height:9px;border-radius:50%;background:#333;transition:background .4s,box-shadow .4s}
.dot.live{background:#00e676;box-shadow:0 0 8px #00e676}
nav{background:#0a0a0a;border-bottom:1px solid #222;display:flex;flex-shrink:0}
nav button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:#666;font-family:inherit;font-size:0.78em;letter-spacing:2px;padding:10px 4px;cursor:pointer;transition:color .2s,border-color .2s;text-transform:uppercase}
nav button.active{color:#ff9000;border-bottom-color:#ff9000}
nav button:active{opacity:.7}
.page{flex:1;overflow-y:auto;display:none;flex-direction:column}
.page.active{display:flex}
/* ---- Log page ---- */
#log{padding:10px 16px;display:flex;flex-direction:column;gap:1px}
.ev{display:flex;gap:12px;font-size:0.82em;padding:4px 0;border-bottom:1px solid #181818}
.ts{color:#444;white-space:nowrap;flex-shrink:0}
.msg{word-break:break-word}
.msg.sys{color:#ffa040}
.msg.evt{color:#b0d4b0}
/* ---- Control pages ---- */
.ctrl-page{padding:20px 18px;gap:16px;flex-direction:column}
.section-title{font-size:0.7em;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:4px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-btn{background:#161616;border:1px solid #2a2a2a;border-radius:6px;color:#ccc;font-family:inherit;font-size:0.8em;padding:14px 10px;cursor:pointer;text-align:center;line-height:1.4;transition:background .15s,border-color .15s}
.mode-btn:active{background:#222}
.mode-btn.danger{border-color:#5a1a1a;color:#e87070}
.mode-btn.danger:active{background:#2a0e0e}
.mode-btn .label{font-weight:700;font-size:1em;letter-spacing:1px}
.mode-btn .sub{font-size:0.8em;color:#555;margin-top:3px}
.stop-btn{background:#1a0a0a;border:1px solid #8b2020;border-radius:6px;color:#f06060;font-family:inherit;font-size:0.85em;font-weight:700;letter-spacing:2px;padding:16px;cursor:pointer;text-align:center;text-transform:uppercase;transition:background .15s}
.stop-btn:active{background:#2a0e0e}
.status-chip{background:#111;border:1px solid #222;border-radius:4px;padding:8px 12px;font-size:0.78em;color:#888}
.status-chip span{color:#e0e0e0}
footer{background:#111;border-top:1px solid #1e1e1e;padding:6px 18px;font-size:0.7em;color:#444;flex-shrink:0}
</style>
</head>
<body>
<header>
  <span class="brand">MOCO JIB</span>
  <div class="conn">
    <div class="dot" id="dot"></div>
    <span id="conn-status">Connecting&hellip;</span>
  </div>
</header>
<nav>
  <button class="active" onclick="showPage('log',this)">Log</button>
  <button onclick="showPage('timelapse',this)">Timelapse</button>
  <button onclick="showPage('bounce',this)">Bounce</button>
  <button onclick="showPage('drone',this)">Drone</button>
</nav>

<!-- LOG PAGE -->
<div class="page active" id="page-log">
  <div id="log"></div>
</div>

<!-- TIMELAPSE PAGE -->
<div class="page ctrl-page" id="page-timelapse">
  <div>
    <div class="section-title">Status</div>
    <div class="status-chip">Mode: <span id="tl-status">Idle</span></div>
  </div>
  <div>
    <div class="section-title">Start Direction</div>
    <div class="mode-grid">
      <button class="mode-btn" onclick="send('CMD:TL_START:5')"><div class="label">&#8592; Swing L</div></button>
      <button class="mode-btn" onclick="send('CMD:TL_START:7')"><div class="label">Swing R &#8594;</div></button>
      <button class="mode-btn" onclick="send('CMD:TL_START:6')"><div class="label">Boom &#8593;</div></button>
      <button class="mode-btn" onclick="send('CMD:TL_START:8')"><div class="label">Boom &#8595;</div></button>
      <button class="mode-btn" onclick="send('CMD:TL_START:2')"><div class="label">&#8592; Swing L</div><div class="sub">+ Boom &#8593;</div></button>
      <button class="mode-btn" onclick="send('CMD:TL_START:3')"><div class="label">Swing R &#8594;</div><div class="sub">+ Boom &#8593;</div></button>
      <button class="mode-btn" onclick="send('CMD:TL_START:1')"><div class="label">&#8592; Swing L</div><div class="sub">+ Boom &#8595;</div></button>
      <button class="mode-btn" onclick="send('CMD:TL_START:4')"><div class="label">Swing R &#8594;</div><div class="sub">+ Boom &#8595;</div></button>
    </div>
  </div>
  <button class="stop-btn" onclick="send('CMD:TL_STOP')">&#9632; Stop Timelapse</button>
</div>

<!-- BOUNCE PAGE -->
<div class="page ctrl-page" id="page-bounce">
  <div>
    <div class="section-title">Status</div>
    <div class="status-chip">Mode: <span id="bounce-status">Idle</span></div>
  </div>
  <div>
    <div class="section-title">Direction</div>
    <div class="mode-grid">
      <button class="mode-btn" onclick="send('CMD:BOUNCE_START:5')"><div class="label">&#8592; Swing L</div></button>
      <button class="mode-btn" onclick="send('CMD:BOUNCE_START:7')"><div class="label">Swing R &#8594;</div></button>
      <button class="mode-btn" onclick="send('CMD:BOUNCE_START:6')"><div class="label">Boom &#8593;</div></button>
      <button class="mode-btn" onclick="send('CMD:BOUNCE_START:8')"><div class="label">Boom &#8595;</div></button>
      <button class="mode-btn" onclick="send('CMD:BOUNCE_START:2')"><div class="label">&#8592; Swing L</div><div class="sub">+ Boom &#8593;</div></button>
      <button class="mode-btn" onclick="send('CMD:BOUNCE_START:3')"><div class="label">Swing R &#8594;</div><div class="sub">+ Boom &#8593;</div></button>
      <button class="mode-btn" onclick="send('CMD:BOUNCE_START:1')"><div class="label">&#8592; Swing L</div><div class="sub">+ Boom &#8595;</div></button>
      <button class="mode-btn" onclick="send('CMD:BOUNCE_START:4')"><div class="label">Swing R &#8594;</div><div class="sub">+ Boom &#8595;</div></button>
    </div>
  </div>
  <button class="stop-btn" onclick="send('CMD:BOUNCE_STOP')">&#9632; Stop Bounce</button>
</div>

<!-- DRONE PAGE -->
<div class="page ctrl-page" id="page-drone">
  <div>
    <div class="section-title">Status</div>
    <div class="status-chip">Mode: <span id="drone-status">Manual</span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <button class="mode-btn" style="padding:18px" onclick="send('CMD:DRONE_ON')"><div class="label">&#9654; Activate Drone Mode</div></button>
    <button class="stop-btn" onclick="send('CMD:DRONE_OFF')">&#9632; Deactivate Drone Mode</button>
  </div>
</div>

<footer>192.168.4.1 &nbsp;&bull;&nbsp; MOCO Jib Console</footer>
<script>
(function(){
  var ws,rt;
  var log=document.getElementById('log');
  var dot=document.getElementById('dot');
  var connSt=document.getElementById('conn-status');

  window.showPage=function(id,btn){
    document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
    document.querySelectorAll('nav button').forEach(function(b){b.classList.remove('active')});
    document.getElementById('page-'+id).classList.add('active');
    btn.classList.add('active');
  };

  window.send=function(cmd){
    if(ws&&ws.readyState===1){ws.send(cmd)}
    else{logRow('Not connected','sys')}
  };

  function ts(){var d=new Date(),p=function(n){return n<10?'0'+n:n};return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
  function logRow(msg,cls){
    var el=document.createElement('div');el.className='ev';
    el.innerHTML='<span class="ts">'+ts()+'</span><span class="msg '+(cls||'evt')+'">'+String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>';
    log.appendChild(el);
    if(log.children.length>500)log.removeChild(log.firstChild);
    log.scrollTop=log.scrollHeight;
  }
  function updateStatus(msg){
    /* update status chips from event stream */
    if(msg.indexOf('Mode: Timelapse')===0||msg.indexOf('TIMELAPSE')>=0){
      var s=msg.replace(/^Mode:\s*/,'');
      document.getElementById('tl-status').textContent=s;
    } else if(msg.indexOf('Mode: Bounce')===0||msg.indexOf('BOUNCE')>=0){
      var s=msg.replace(/^Mode:\s*/,'');
      document.getElementById('bounce-status').textContent=s;
    } else if(msg.indexOf('Mode: Drone')===0){
      document.getElementById('drone-status').textContent='Drone Mode Active';
    } else if(msg.indexOf('Mode: Manual')===0){
      document.getElementById('drone-status').textContent='Manual';
      document.getElementById('tl-status').textContent='Idle';
      document.getElementById('bounce-status').textContent='Idle';
    }
  }
  function connect(){
    clearTimeout(rt);
    ws=new WebSocket('ws://'+location.host+'/ws');
    ws.onopen=function(){dot.className='dot live';connSt.textContent='Live';logRow('Console connected','sys')};
    ws.onmessage=function(e){logRow(e.data);updateStatus(e.data)};
    ws.onclose=function(){dot.className='dot';connSt.textContent='Reconnecting\u2026';rt=setTimeout(connect,3000)};
    ws.onerror=function(){ws.close()};
  }
  connect();
})();
</script>
</body>
</html>
