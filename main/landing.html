<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOCO Jib</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e0e0e0;font-family:'Courier New',monospace;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:#111;border-bottom:2px solid #e87700;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{font-size:1.1em;font-weight:700;color:#ff9000;letter-spacing:4px}
.conn{display:flex;align-items:center;gap:6px;font-size:0.75em;color:#888}
.dot{width:9px;height:9px;border-radius:50%;background:#333;transition:background .4s}
.dot.live{background:#00e676;box-shadow:0 0 8px #00e676}
nav{background:#111;border-bottom:1px solid #222;flex-shrink:0;display:flex}
.tab{flex:1;padding:9px 4px;text-align:center;font-size:0.72em;letter-spacing:2px;color:#555;cursor:pointer;border-bottom:3px solid transparent;text-decoration:none;display:block}
.tab.on{color:#ff9000;border-bottom-color:#ff9000}
#log{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:1px}
.ev{display:flex;gap:10px;font-size:0.8em;padding:3px 0;border-bottom:1px solid #181818}
.ts{color:#444;white-space:nowrap;flex-shrink:0}
.msg{word-break:break-word}
.sys{color:#ffa040}

</style></head><body>
<header><span class="brand">MOCO JIB</span><div class="conn"><div class="dot" id="dot"></div><span id="cst">Connecting…</span></div></header>
<nav>
  <div class="tab on">CONSOLE</div>
  <a class="tab" href="/settings">SETTINGS</a>
</nav>
<div id="log"></div>
<script>
var log=document.getElementById('log'),dot=document.getElementById('dot'),cst=document.getElementById('cst'),ws,rt,ct;
function ts(){var d=new Date(),p=function(n){return n<10?'0'+n:n};return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
function row(msg,cls){var e=document.createElement('div');e.className='ev';e.innerHTML='<span class="ts">'+ts()+'</span><span class="msg '+(cls||'')+'">'+msg.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>';log.appendChild(e);if(log.children.length>500)log.removeChild(log.firstChild);log.scrollTop=log.scrollHeight}
function cleanup(){clearTimeout(rt);clearTimeout(ct);if(ws){try{ws.onopen=ws.onclose=ws.onerror=ws.onmessage=null;ws.close()}catch(e){}}ws=null}
function connect(){cleanup();ws=new WebSocket('ws://192.168.4.1/ws');ct=setTimeout(function(){if(ws&&ws.readyState!==1){cleanup();dot.className='dot';cst.textContent='Reconnecting…';rt=setTimeout(connect,300)}},5000);ws.onopen=function(){clearTimeout(ct);dot.className='dot live';cst.textContent='Live';row('Console connected','sys')};ws.onmessage=function(e){row(e.data)};ws.onclose=function(){cleanup();dot.className='dot';cst.textContent='Reconnecting…';rt=setTimeout(connect,300)};ws.onerror=function(){cleanup();rt=setTimeout(connect,300)}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(!ws||ws.readyState!==1)){cleanup();connect()}});
rt=setTimeout(connect,100);
</script></body></html>
